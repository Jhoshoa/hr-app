services:
  postgres:
    image: postgres:16-alpine
    container_name: hr-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hr_app
      POSTGRES_PASSWORD: hr_app_password
      POSTGRES_DB: hr_app
    ports:
      - "5434:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr_app -d hr_app"]
      interval: 10s
      timeout: 5s
      retries: 5
